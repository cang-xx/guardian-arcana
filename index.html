<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reveal Your Guardian Arcana · The Arcana Covenant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Noto+Serif+SC:wght@300;500&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            night: '#0a0a0a',
            gold: { dim: '#6b5a2e', soft: '#9a7b3f', bright: '#c9a227', glow: '#e8c547' },
            bronze: '#8b7355',
            copper: '#a67c52',
          },
          fontFamily: {
            display: ['Cinzel', 'Noto Serif SC', 'serif'],
            body: ['Cormorant Garamond', 'Noto Serif SC', 'serif'],
          },
        },
      },
    };
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100vh;
      background: #0a0a0a;
      overflow-x: hidden;
      cursor: default;
    }

    #starfield {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse 75% 65% at 50% 42%, transparent 0%, rgba(0,0,0,0.6) 100%);
    }

    .arcana-watermark {
      font-family: 'Cinzel', serif;
      font-size: clamp(4.5rem, 13vw, 10rem);
      font-weight: 700;
      letter-spacing: 0.2em;
      color: transparent;
      -webkit-text-stroke: 1px rgba(201, 162, 39, 0.1);
      text-stroke: 1px rgba(201, 162, 39, 0.1);
      user-select: none;
      pointer-events: none;
      white-space: nowrap;
    }

    @keyframes lunar-breathe {
      0%, 100% { opacity: 0.75; filter: drop-shadow(0 0 8px rgba(201,162,39,0.25)); }
      50% { opacity: 1; filter: drop-shadow(0 0 18px rgba(201,162,39,0.45)); }
    }
    .lunar-icon { animation: lunar-breathe 6s ease-in-out infinite; }

    #welcome-layer.transitioning {
      filter: blur(16px);
      opacity: 0;
      pointer-events: none;
      transition: filter 1.8s ease-in-out, opacity 1.8s ease-in-out;
    }

    #smoke-overlay {
      position: fixed;
      inset: 0;
      z-index: 15;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(ellipse 120% 80% at 50% 100%, rgba(180, 170, 150, 0.22) 0%, transparent 55%),
        radial-gradient(ellipse 90% 60% at 30% 50%, rgba(120, 115, 105, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse 90% 60% at 70% 40%, rgba(100, 95, 90, 0.1) 0%, transparent 45%);
    }
    #smoke-overlay.active {
      opacity: 1;
      transition: opacity 0.9s ease-in;
    }
    #smoke-overlay.dissipate {
      opacity: 0;
      transition: opacity 1.4s ease-out;
    }

    /* ── Quiz ── */
    #quiz-container {
      display: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1s ease, visibility 1s ease;
    }
    #quiz-container.visible,
    #quiz-container.quiz-fade-out {
      display: flex;
    }
    #quiz-container.visible {
      opacity: 1;
      visibility: visible;
    }
    #quiz-container.quiz-fade-out {
      filter: blur(14px);
      opacity: 0;
      transition: filter 1s ease-in-out, opacity 1s ease-in-out;
      pointer-events: none;
    }

    /* ── Shuffle loading ritual ── */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      pointer-events: none;
    }
    #loading-screen.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    #loading-screen.dissolving {
      opacity: 0;
      transition: opacity 0.9s ease;
    }
    #loading-screen.ritual-out .loading-astrolabe,
    #loading-screen.ritual-out .shuffle-stage,
    #loading-screen.ritual-out .loading-caption-wrap {
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    /* ── Result reveal ── */
    #result-screen {
      position: fixed;
      inset: 0;
      z-index: 35;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      box-sizing: border-box;
      padding: clamp(60px, 9vh, 80px) 1.5rem clamp(60px, 9vh, 80px);
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.1s ease, visibility 1.1s ease;
      pointer-events: none;
    }
    #result-screen.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #result-screen > * {
      flex-shrink: 0;
      width: 100%;
      max-width: 36rem;
    }

    .result-header {
      text-align: center;
      max-width: 36rem;
      max-height: 0;
      margin-bottom: 0;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.85s ease 0.15s, transform 0.85s ease 0.15s, max-height 0.65s ease, margin-bottom 0.65s ease;
    }
    .result-header.revealed {
      max-height: none;
      overflow: visible;
      margin-bottom: clamp(1.25rem, 4vh, 2rem);
      opacity: 1;
      transform: translateY(0);
    }
    .result-header h2 {
      font-family: 'Cinzel', 'Noto Serif SC', serif;
      font-size: clamp(0.72rem, 2vw, 0.95rem);
      font-weight: 600;
      letter-spacing: 0.28em;
      line-height: 1.75;
      color: rgba(235, 228, 210, 0.92);
      text-transform: uppercase;
    }
    .result-header .title-divider {
      color: rgba(201, 162, 39, 0.55);
      margin: 0 0.35em;
      font-weight: 400;
    }
    .result-header .title-zh {
      font-family: 'Noto Serif SC', serif;
      font-size: 0.88em;
      letter-spacing: 0.28em;
      color: rgba(228, 210, 175, 0.9);
      font-weight: 300;
    }

    .result-card-scene {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: none;
      width: auto;
      padding: 0.5rem 0;
    }

    .guardian-glow {
      position: absolute;
      left: 50%;
      top: 50%;
      width: clamp(220px, 40vw, 340px);
      height: clamp(352px, 64vw, 544px);
      transform: translate(-50%, -52%);
      border-radius: 12px;
      pointer-events: none;
      animation: guardian-glow-breathe 4.2s ease-in-out infinite;
    }
    @keyframes guardian-glow-breathe {
      0%, 100% {
        filter: drop-shadow(0 0 18px rgba(201, 162, 39, 0.22)) drop-shadow(0 0 42px rgba(201, 162, 39, 0.08));
        opacity: 0.65;
      }
      50% {
        filter: drop-shadow(0 0 32px rgba(232, 197, 71, 0.42)) drop-shadow(0 0 72px rgba(201, 162, 39, 0.18));
        opacity: 1;
      }
    }

    .guardian-flip {
      width: clamp(200px, 34vw, 300px);
      aspect-ratio: 5 / 8;
      perspective: 1400px;
      cursor: pointer;
      position: relative;
      z-index: 2;
      border: none;
      background: transparent;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .guardian-flip.is-flipped { cursor: default; }

    .guardian-flip-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 1.15s cubic-bezier(0.42, 0.02, 0.18, 1);
      border-radius: 9px;
    }
    .guardian-flip.is-flipped .guardian-flip-inner {
      transform: rotateY(180deg);
    }

    .guardian-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 9px;
      overflow: hidden;
    }
    .guardian-face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 9px;
    }
    .guardian-front {
      transform: rotateY(180deg);
    }

    .result-flip-hint {
      margin-top: clamp(1.25rem, 4vh, 2rem);
      font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
      font-size: clamp(0.9rem, 2vw, 1.05rem);
      font-style: italic;
      letter-spacing: 0.12em;
      color: rgba(180, 165, 135, 0.55);
      text-align: center;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .result-flip-hint.hidden-hint {
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
    }

    .result-details {
      text-align: center;
      max-width: 34rem;
      max-height: 0;
      margin-top: 0;
      overflow: hidden;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.9s ease 0.35s, transform 0.9s ease 0.35s, max-height 0.7s ease, margin-top 0.7s ease;
    }
    .result-details.revealed {
      max-height: none;
      overflow: visible;
      margin-top: clamp(1.5rem, 5vh, 2.5rem);
      opacity: 1;
      transform: translateY(0);
    }

    .result-card-title {
      font-family: 'Cinzel', 'Noto Serif SC', serif;
      font-size: clamp(1.05rem, 2.8vw, 1.45rem);
      letter-spacing: 0.22em;
      color: rgba(201, 162, 39, 0.88);
      line-height: 1.6;
      margin-bottom: clamp(1rem, 3vh, 1.5rem);
    }

    .result-oracle {
      font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
      font-size: clamp(0.92rem, 2.1vw, 1.08rem);
      line-height: 1.85;
      letter-spacing: 0.04em;
      color: rgba(190, 178, 155, 0.78);
      text-align: justify;
      text-align-last: center;
    }

    .result-reenter {
      max-height: 0;
      margin-top: 0;
      overflow: hidden;
      padding-bottom: 0;
      opacity: 0;
      text-align: center;
      transition: opacity 0.85s ease 0.55s, max-height 0.5s ease, margin-top 0.5s ease, padding-bottom 0.5s ease;
    }
    .result-reenter.revealed {
      max-height: none;
      overflow: visible;
      margin-top: clamp(2rem, 6vh, 3rem);
      padding-bottom: 0;
      opacity: 1;
    }

    .result-reenter-btn {
      display: block;
      width: 100%;
      text-align: center;
      font-family: 'Cinzel', serif;
      font-size: clamp(0.62rem, 1.6vw, 0.72rem);
      letter-spacing: 0.28em;
      color: rgba(212, 175, 55, 0.72);
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.35s ease, letter-spacing 0.35s ease;
      text-transform: uppercase;
    }
    .result-reenter-btn:hover {
      color: rgba(240, 220, 160, 0.92);
      letter-spacing: 0.32em;
    }

    .loading-astrolabe {
      position: absolute;
      width: min(82vw, 500px);
      height: min(82vw, 500px);
      opacity: 0.4;
      filter: drop-shadow(0 0 24px rgba(201, 162, 39, 0.12));
      animation: astrolabe-spin 36s linear infinite;
    }
    @keyframes astrolabe-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .shuffle-stage {
      position: relative;
      width: clamp(260px, 50vw, 360px);
      height: clamp(360px, 62vw, 480px);
      z-index: 2;
    }

    .shuffle-card {
      position: absolute;
      left: 50%;
      top: 50%;
      width: clamp(104px, 21vw, 140px);
      aspect-ratio: 5 / 8;
      border-radius: 7px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
      transition: transform 0.55s cubic-bezier(0.45, 0.05, 0.2, 1);
      will-change: transform;
    }
    .shuffle-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 7px;
    }
    .shuffle-card .shuffle-back {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 7px;
    }

    .loading-caption-wrap {
      position: relative;
      z-index: 3;
      margin-top: clamp(2.5rem, 8vh, 4rem);
      min-height: 3.5rem;
      text-align: center;
      padding: 0 1.5rem;
    }
    .loading-caption {
      font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
      font-size: clamp(0.95rem, 2.2vw, 1.15rem);
      color: rgba(200, 185, 155, 0.75);
      letter-spacing: 0.06em;
      line-height: 1.65;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    .loading-caption.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .loading-caption .caption-en {
      display: block;
      font-family: 'Cinzel', serif;
      font-size: 0.72em;
      letter-spacing: 0.2em;
      color: rgba(154, 123, 63, 0.55);
      margin-top: 0.35rem;
      text-transform: uppercase;
    }

    .quiz-progress-track {
      height: 3px;
      background: rgba(107, 90, 46, 0.25);
      border-radius: 2px;
      overflow: hidden;
    }
    .quiz-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6b5a2e, #c9a227, #a67c52);
      box-shadow: 0 0 12px rgba(201, 162, 39, 0.45);
      transition: width 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .quiz-question-wrap {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    .quiz-question-wrap.exiting {
      opacity: 0;
      transform: translateY(-12px);
    }
    .quiz-question-wrap.entering {
      opacity: 0;
      transform: translateY(14px);
    }

    .quiz-q-num {
      color: rgba(212, 175, 55, 0.88);
    }
    .quiz-opt-key {
      color: rgba(228, 205, 150, 0.92);
    }

    .quiz-option {
      border: 1px solid rgba(154, 123, 63, 0.28);
      background: rgba(15, 15, 18, 0.65);
      transition: border-color 0.3s ease, background 0.3s ease, box-shadow 0.3s ease, transform 0.25s ease;
    }
    .quiz-option:hover:not(:disabled) {
      border-color: rgba(212, 175, 55, 0.55);
      background: rgba(28, 24, 14, 0.82);
      box-shadow: 0 0 26px rgba(212, 175, 55, 0.16), 0 0 48px rgba(201, 162, 39, 0.06);
      transform: translateX(4px);
    }
    .quiz-option:disabled { cursor: default; opacity: 0.7; }

    .quiz-brand {
      font-family: 'Cinzel', serif;
      letter-spacing: 0.42em;
      color: rgba(154, 123, 63, 0.32);
    }

    /* ── Hero visual gravity ── */
    .hero-block {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(3rem, 8vh, 5rem) 1rem clamp(1.5rem, 4vh, 2.5rem);
      min-height: clamp(280px, 38vh, 420px);
    }

    /* ── Tarot card (1 : 1.6) ── */
    .tarot-card {
      flex-shrink: 0;
      width: clamp(76px, 8.5vw, 118px);
      aspect-ratio: 5 / 8;
      border-radius: 7px;
      cursor: pointer;
      position: relative;
      will-change: transform;
      overflow: visible;
      transition: filter 0.45s ease;
    }

    .tarot-card .card-face {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 7px;
      pointer-events: none;
      user-select: none;
    }

    /* Soft radial glow — no hard border */
    .tarot-card .card-glow {
      position: absolute;
      inset: -35%;
      border-radius: 50%;
      background: radial-gradient(
        ellipse 55% 65% at 50% 50%,
        rgba(232, 197, 71, 0.42) 0%,
        rgba(201, 162, 39, 0.18) 35%,
        transparent 72%
      );
      opacity: 0;
      filter: blur(14px);
      transition: opacity 0.45s ease;
      z-index: -1;
      pointer-events: none;
    }

    .tarot-card.hovered .card-glow {
      opacity: 1;
    }

    .tarot-card.hovered {
      filter: brightness(1.1);
      box-shadow:
        0 0 18px 6px rgba(212, 175, 55, 0.22),
        0 0 42px 18px rgba(201, 162, 39, 0.1),
        0 0 72px 36px rgba(201, 162, 39, 0.05),
        0 16px 40px rgba(0, 0, 0, 0.55);
      z-index: 20;
    }

    /* ── Infinite card runway ── */
    .card-viewport {
      position: relative;
      width: 100vw;
      left: 50%;
      transform: translateX(-50%);
      overflow: hidden;
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      min-height: clamp(200px, 28vh, 320px);
      mask-image: linear-gradient(
        90deg,
        transparent 0%,
        black 6%,
        black 94%,
        transparent 100%
      );
      -webkit-mask-image: linear-gradient(
        90deg,
        transparent 0%,
        black 6%,
        black 94%,
        transparent 100%
      );
    }

    .card-track {
      display: flex;
      align-items: center;
      gap: clamp(14px, 2.2vw, 26px);
      padding: 28px 0;
      will-change: transform;
    }

    @keyframes hint-pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.55; }
    }
    .hint-text { animation: hint-pulse 4s ease-in-out infinite; }

    .ornament-line {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(154,123,63,0.4), transparent);
    }

    @media (min-width: 769px) {
      #welcome-layer {
        height: auto;
        max-height: none;
        overflow: visible;
      }
    }

    /* ── Mobile homepage: one screen, no clip ── */
    @media (max-width: 768px) {
      #welcome-layer {
        --m-card-w: clamp(54px, 14.5vw, 70px);
        --m-card-h: calc(var(--m-card-w) * 1.6);
        display: grid;
        grid-template-rows: auto auto auto;
        align-content: space-evenly;
        justify-items: center;
        height: 100dvh;
        max-height: 100dvh;
        min-height: 100dvh;
        overflow: hidden;
        padding-top: 1.75rem;
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      #welcome-layer > header {
        position: absolute;
        top: 0.65rem;
        left: 0.75rem;
      }

      .hero-block {
        min-height: 0;
        width: 100%;
        padding: 0.2rem 0.75rem 0.15rem;
      }

      .hero-block .lunar-icon {
        margin-bottom: 0.35rem !important;
      }

      .hero-block .lunar-icon svg {
        width: 44px;
        height: 44px;
      }

      .hero-block .ornament-line.mb-6 {
        width: 5rem;
        margin-bottom: 0.45rem !important;
      }

      .hero-block .ornament-line.mt-8 {
        width: 3.5rem;
        margin-top: 0.4rem !important;
      }

      .hero-block h1 {
        font-size: 0.92rem !important;
        letter-spacing: 0.14em !important;
      }

      .hero-block blockquote {
        margin-top: 0.35rem !important;
      }

      .hero-block blockquote .text-sm {
        font-size: 0.72rem !important;
      }

      .hero-block blockquote .text-xs {
        font-size: 0.65rem !important;
        margin-top: 0.15rem !important;
      }

      .arcana-watermark {
        font-size: clamp(2.5rem, 12vw, 3.5rem) !important;
      }

      .card-viewport {
        flex: none;
        width: 100%;
        min-height: var(--m-card-h);
        height: var(--m-card-h);
        max-height: var(--m-card-h);
        overflow: visible;
        align-items: center;
        padding: 0;
      }

      .card-track {
        padding: 0;
        gap: 10px;
        height: 100%;
        align-items: center;
      }

      .tarot-card {
        width: var(--m-card-w);
        height: var(--m-card-h);
        aspect-ratio: auto;
        overflow: hidden;
      }

      .tarot-card .card-glow {
        display: none;
      }

      .tarot-card.hovered {
        transform: scale(1.04) !important;
        box-shadow: 0 0 16px rgba(212, 175, 55, 0.2);
      }

      #welcome-layer .welcome-footer {
        width: 100%;
        padding-top: 0.15rem;
        padding-bottom: max(0.35rem, env(safe-area-inset-bottom, 0px));
      }

      #welcome-layer .welcome-footer .hint-text {
        font-size: 9px !important;
        letter-spacing: 0.2em !important;
      }
    }

    @media (max-width: 768px) and (max-height: 680px) {
      #welcome-layer {
        --m-card-w: clamp(48px, 13vw, 58px);
      }

      .hero-block .lunar-icon svg {
        width: 36px;
        height: 36px;
      }

      .hero-block h1 {
        font-size: 0.82rem !important;
      }

      .card-track {
        gap: 8px;
      }
    }
  </style>
</head>
<body class="text-stone-300 font-body antialiased">

  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div id="smoke-overlay" aria-hidden="true"></div>

  <div id="welcome-layer" class="relative z-10 min-h-screen h-screen max-h-screen flex flex-col overflow-hidden">

    <header class="absolute top-6 left-6 md:top-8 md:left-10 z-20">
      <p class="font-display text-[10px] md:text-xs tracking-[0.35em] text-gold-dim/80 uppercase select-none">
        ✧ THE ARCANA COVENANT ✧
      </p>
    </header>

    <!-- Hero — visual center of gravity -->
    <section class="hero-block">

      <div class="lunar-icon mb-5 md:mb-7" aria-hidden="true">

  <script>
    window.appState = 'welcome';

    const CARD_BACK_SRC = 'assets/card-back.png';

    (function preloadCardBack() {
      const img = new Image();
      img.src = CARD_BACK_SRC;
    })();

    /* ── Starfield ── */
    (function initStarfield() {
      const canvas = document.getElementById('starfield');
      const ctx = canvas.getContext('2d');
      let stars = [], w, h;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }

      function createStars(count) {
        stars = Array.from({ length: count }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.2 + 0.2,
          baseAlpha: Math.random() * 0.35 + 0.08,
          phase: Math.random() * Math.PI * 2,
          speed: Math.random() * 0.008 + 0.003,
          drift: (Math.random() - 0.5) * 0.15,
        }));
      }

      function draw(t) {
        ctx.clearRect(0, 0, w, h);
        for (const s of stars) {
          const twinkle = s.baseAlpha + Math.sin(t * s.speed + s.phase) * 0.12;
          const alpha = Math.max(0.04, Math.min(0.55, twinkle));
          s.x += s.drift * 0.02;
          if (s.x < 0) s.x = w;
          if (s.x > w) s.x = 0;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(220, 210, 180, ${alpha})`;
          ctx.fill();
          if (s.r > 0.8) {
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(201, 162, 39, ${alpha * 0.15})`;
            ctx.fill();
          }
        }
        requestAnimationFrame(draw);
      }

      resize();
      createStars(Math.floor((w * h) / 9000));
      window.addEventListener('resize', () => {
        resize();
        createStars(Math.floor((w * h) / 9000));
      });
      requestAnimationFrame(draw);
    })();

    /* ── Build infinite-feel card strip ── */
    const track = document.getElementById('card-track');
    const cardZone = document.getElementById('card-zone');
    const cards = [];

    function computeCardCount() {
      const cardW = Math.min(118, Math.max(76, window.innerWidth * 0.085));
      const gap = Math.min(26, Math.max(14, window.innerWidth * 0.022));
      const perScreen = Math.ceil(window.innerWidth / (cardW + gap));
      return Math.max(25, perScreen * 5);
    }

    function buildCards() {
      track.innerHTML = '';
      cards.length = 0;
      const count = computeCardCount();

      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'tarot-card';
        el.setAttribute('role', 'button');
        el.setAttribute('tabindex', '0');
        el.setAttribute('aria-label', `塔罗牌 ${i + 1}`);
        el.dataset.index = i;
        el.innerHTML = `
          <span class="card-glow" aria-hidden="true"></span>
          <img class="card-face" src="${CARD_BACK_SRC}" alt="塔罗牌背面" draggable="false" />
        `;
        track.appendChild(el);
        cards.push(el);
      }
    }

    buildCards();

    /* ── Parallax + inertia (full-screen mouse X) ── */
    let targetOffset = 0;
    let currentOffset = 0;
    let velocity = 0;
    let hoveredCard = null;
    let maxOffset = 0;
    let baseCenter = 0;
    let mouseRatio = 0.5;

    function updateBounds() {
      const viewW = window.innerWidth;
      const trackW = track.scrollWidth;
      maxOffset = Math.max(0, (trackW - viewW) / 2);
      baseCenter = (viewW - trackW) / 2;
      applyParallaxTarget();
    }

    function applyParallaxTarget() {
      /* Left → shift right (see deeper cards on the right); right → shift left */
      const parallax = (0.5 - mouseRatio) * maxOffset * 2;
      targetOffset = baseCenter + parallax;
    }

    function setTargetFromMouse(clientX) {
      mouseRatio = clientX / window.innerWidth;
      mouseRatio = Math.max(0, Math.min(1, mouseRatio));
      applyParallaxTarget();
    }

    function hitTestCards(clientX, clientY) {
      let found = null;
      for (const card of cards) {
        const r = card.getBoundingClientRect();
        if (clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom) {
          found = card;
          break;
        }
      }
      if (found !== hoveredCard) {
        if (hoveredCard) hoveredCard.classList.remove('hovered');
        hoveredCard = found;
        if (hoveredCard) hoveredCard.classList.add('hovered');
      }
    }

    document.addEventListener('mousemove', (e) => {
      if (window.appState !== 'welcome') return;
      setTargetFromMouse(e.clientX);
      hitTestCards(e.clientX, e.clientY);
    });

    document.addEventListener('mouseleave', () => {
      mouseRatio = 0.5;
      applyParallaxTarget();
      if (hoveredCard) {
        hoveredCard.classList.remove('hovered');
        hoveredCard = null;
      }
    });

    /* Spring-damper physics loop */
    function animateTrack() {
      const diff = targetOffset - currentOffset;
      velocity += diff * 0.036;
      velocity *= 0.87;
      currentOffset += velocity;

      track.style.transform = `translateX(${currentOffset}px)`;

      const now = Date.now() / 1000;
      const viewCenter = window.innerWidth / 2;

      const compactHome = window.innerWidth < 768;

      cards.forEach((card, i) => {
        const rect = card.getBoundingClientRect();
        const cardCenter = rect.left + rect.width / 2;
        const distNorm = Math.min(1, Math.abs(cardCenter - viewCenter) / (window.innerWidth * 0.55));
        const depthScale = 1 - distNorm * 0.06;
        const depthOpacity = 1 - distNorm * 0.22;
        const isHovered = card.classList.contains('hovered');

        if (compactHome) {
          const hoverScale = isHovered ? 1.04 : 1;
          card.style.opacity = depthOpacity;
          card.style.transform = `scale(${depthScale * hoverScale})`;
        } else {
          const floatY = Math.sin(now * (0.75 + (i % 7) * 0.07) + i * 0.55) * 7;
          const stagger = Math.sin(now * 0.45 + i * 0.4) * 2.5;
          const hoverLift = isHovered ? -16 : 0;
          const hoverScale = isHovered ? 1.12 : 1;
          card.style.opacity = depthOpacity;
          card.style.transform = `translateY(${floatY + stagger + hoverLift}px) scale(${depthScale * hoverScale})`;
        }
      });

      requestAnimationFrame(animateTrack);
    }

    function onResize() {
      const prevRatio = mouseRatio;
      buildCards();
      updateBounds();
      mouseRatio = prevRatio;
      applyParallaxTarget();
      currentOffset = targetOffset;
    }

    updateBounds();
    currentOffset = targetOffset;
    window.addEventListener('resize', onResize);
    requestAnimationFrame(animateTrack);

    /* ═══════════════════════════════════════════
       Quiz — soul axis scoring & flow
    ═══════════════════════════════════════════ */
    const TRAIT_DELTAS = {
      '内倾': { introversion: 5 },
      '外倾': { introversion: -5 },
      '理性': { logic: 5 },
      '感性': { logic: -5 },
      '稳定': { stability: 5 },
      '变革': { stability: -5 },
      '理想': { idealism: 5 },
      '现实': { idealism: -5 },
    };

    window.soulScores = {
      introversion: 50,
      logic: 50,
      stability: 50,
      idealism: 50,
    };

    const quizContainer = document.getElementById('quiz-container');
    const quizMain = document.getElementById('quiz-main');
    const quizProgressFill = document.getElementById('quiz-progress-fill');
    const quizProgressLabel = document.getElementById('quiz-progress-label');
    const loadingScreen = document.getElementById('loading-screen');
    const shuffleDeck = document.getElementById('shuffle-deck');
    const loadingCaption = document.getElementById('loading-caption');
    const resultScreen = document.getElementById('result-screen');
    const guardianFlip = document.getElementById('guardian-flip');
    const guardianFrontImg = document.getElementById('guardian-front-img');
    const resultFlipHint = document.getElementById('result-flip-hint');
    const resultHeader = document.getElementById('result-header');
    const resultDetails = document.getElementById('result-details');
    const resultCardTitle = document.getElementById('result-card-title');
    const resultOracle = document.getElementById('result-oracle');
    const resultReenter = document.getElementById('result-reenter');
    const resultReenterBtn = document.getElementById('result-reenter-btn');
    const smokeOverlay = document.getElementById('smoke-overlay');

    let guardianFlipped = false;

    const SHUFFLE_DURATION_MS = 5000;
    const QUIZ_FADE_MS = 1000;
    const SHUFFLE_CARD_COUNT = 7;
    const CAPTION_CYCLE_MS = 1200;

    const LOADING_CAPTIONS = [
      { zh: '正在洗牌...', en: 'Shuffling the cosmic deck...' },
      { zh: '正在编织命运的丝线...', en: 'Weaving your destiny...' },
      { zh: '聆听牌灵的指引...', en: 'Listening to the echo...' },
    ];

    let currentQuestionIndex = 0;
    let isAdvancing = false;
    let shuffleIntervalId = null;
    let captionIntervalId = null;
    let shuffleCards = [];
    let shuffleTick = 0;

    function applyTraitScores(traits) {
      traits.forEach((trait) => {
        const delta = TRAIT_DELTAS[trait];
        if (!delta) return;
        Object.entries(delta).forEach(([axis, value]) => {
          window.soulScores[axis] += value;
        });
      });
    }

    function updateProgress() {
      const n = Math.min(currentQuestionIndex + 1, oracleQuestions.length);
      const pct = (n / oracleQuestions.length) * 100;
      quizProgressFill.style.width = `${pct}%`;
      quizProgressLabel.textContent = `${n} / ${oracleQuestions.length}`;
    }

    function renderQuestion(index, animateIn) {
      const q = oracleQuestions[index];
      if (!q) return;

      const wrap = document.createElement('div');
      wrap.className = 'quiz-question-wrap' + (animateIn ? ' entering' : '');
      wrap.id = 'quiz-question-active';

      wrap.innerHTML = `
        <h2 class="font-body text-lg sm:text-xl md:text-2xl text-stone-100/92 leading-relaxed mb-8 md:mb-10">
          <span class="font-display quiz-q-num tabular-nums">${q.id}.</span>
          ${q.text}
        </h2>
        <div class="space-y-3 md:space-y-4" role="list">
          ${q.options.map((opt) => `
            <button type="button" class="quiz-option w-full text-left px-4 py-3.5 md:px-5 md:py-4 rounded-sm flex gap-3 items-start" data-traits="${opt.traits.join(',')}" role="listitem">
              <span class="font-display quiz-opt-key text-sm mt-0.5 flex-shrink-0">${opt.key}.</span>
              <span class="font-body text-base md:text-lg text-stone-300/90 leading-snug">${opt.text}</span>
            </button>
          `).join('')}
        </div>
      `;

      quizMain.innerHTML = '';
      quizMain.appendChild(wrap);
      updateProgress();

      if (animateIn) {
        requestAnimationFrame(() => {
          requestAnimationFrame(() => wrap.classList.remove('entering'));
        });
      }

      wrap.querySelectorAll('.quiz-option').forEach((btn) => {
        btn.addEventListener('click', () => onOptionSelect(btn, wrap));
      });
    }

    function onOptionSelect(btn, wrap) {
      if (isAdvancing || window.appState !== 'quiz') return;
      isAdvancing = true;

      const traits = btn.dataset.traits.split(',');
      applyTraitScores(traits);

      wrap.querySelectorAll('.quiz-option').forEach((b) => { b.disabled = true; });
      btn.style.borderColor = 'rgba(201, 162, 39, 0.5)';
      btn.style.background = 'rgba(32, 28, 18, 0.85)';

      wrap.classList.add('exiting');

      setTimeout(() => {
        currentQuestionIndex += 1;

        if (currentQuestionIndex >= oracleQuestions.length) {
          finishQuiz();
        } else {
          renderQuestion(currentQuestionIndex, true);
          isAdvancing = false;
        }
      }, 420);
    }

    function buildShuffleDeck() {
      shuffleDeck.innerHTML = '';
      shuffleCards = [];

      for (let i = 0; i < SHUFFLE_CARD_COUNT; i++) {
        const el = document.createElement('div');
        el.className = 'shuffle-card';
        el.innerHTML = `<img class="shuffle-back" src="${CARD_BACK_SRC}" alt="" draggable="false" />`;
        shuffleDeck.appendChild(el);
        shuffleCards.push({
          el,
          x: (i - 3) * 18,
          y: (i % 3 - 1) * 8,
          rot: (i - 3) * 2.5,
          z: i + 1,
        });
      }
      applyShuffleTransforms();
    }

    function applyShuffleTransforms() {
      shuffleCards.forEach((c) => {
        c.el.style.zIndex = c.z;
        c.el.style.transform =
          `translate(calc(-50% + ${c.x}px), calc(-50% + ${c.y}px)) rotate(${c.rot}deg)`;
      });
    }

    function tickShuffleAnimation() {
      shuffleTick += 1;
      const n = shuffleCards.length;

      shuffleCards.forEach((c, i) => {
        const drift = Math.sin(shuffleTick * 0.55 + i * 1.1) * 28;
        const lift = Math.cos(shuffleTick * 0.4 + i * 0.8) * 7;
        c.x += (drift - c.x) * 0.22;
        c.y += (lift - c.y) * 0.18;
        c.rot += (Math.sin(shuffleTick * 0.3 + i) * 5 - c.rot) * 0.15;
      });

      if (shuffleTick % 2 === 0) {
        const a = Math.floor(Math.random() * n);
        let b = Math.floor(Math.random() * n);
        while (b === a) b = Math.floor(Math.random() * n);
        const tempZ = shuffleCards[a].z;
        shuffleCards[a].z = shuffleCards[b].z;
        shuffleCards[b].z = tempZ;
        const tempX = shuffleCards[a].x;
        shuffleCards[a].x = shuffleCards[b].x + (Math.random() - 0.5) * 36;
        shuffleCards[b].x = tempX + (Math.random() - 0.5) * 36;
      }

      applyShuffleTransforms();
    }

    function setLoadingCaption(index) {
      const cap = LOADING_CAPTIONS[index % LOADING_CAPTIONS.length];
      loadingCaption.classList.remove('visible');
      requestAnimationFrame(() => {
        loadingCaption.innerHTML = `${cap.zh}<span class="caption-en">${cap.en}</span>`;
        requestAnimationFrame(() => loadingCaption.classList.add('visible'));
      });
    }

    function startCaptionCycle() {
      let capIndex = 0;
      setLoadingCaption(capIndex);
      captionIntervalId = setInterval(() => {
        capIndex = (capIndex + 1) % LOADING_CAPTIONS.length;
        setLoadingCaption(capIndex);
      }, CAPTION_CYCLE_MS);
    }

    function stopShuffleRitual() {
      if (shuffleIntervalId) clearInterval(shuffleIntervalId);
      if (captionIntervalId) clearInterval(captionIntervalId);
      shuffleIntervalId = null;
      captionIntervalId = null;
    }

    let guardianImageCache = { url: null, ready: false };

    function preloadGuardianImage(card) {
      const url = getArcanaImageUrl(card);
      if (guardianImageCache.url === url && guardianImageCache.ready) {
        return Promise.resolve(guardianImageCache.img);
      }
      guardianImageCache = { url, ready: false, img: null };

      let link = document.getElementById('guardian-preload-link');
      if (!link) {
        link = document.createElement('link');
        link.id = 'guardian-preload-link';
        link.rel = 'preload';
        link.as = 'image';
        document.head.appendChild(link);
      }
      link.href = url;

      return new Promise((resolve, reject) => {
        const img = new Image();
        img.decoding = 'async';
        img.onload = () => {
          guardianImageCache = { url, ready: true, img };
          resolve(img);
        };
        img.onerror = reject;
        img.src = url;
      });
    }

    function resolveGuardianArcana() {
      const result = findGuardianArcana(window.soulScores);
      window.guardianArcana = result;
      preloadGuardianImage(result.card);
      return result;
    }

    function beginShuffleRitual() {
      window.appState = 'shuffling';
      buildShuffleDeck();
      resolveGuardianArcana();

      loadingScreen.classList.add('active');
      loadingScreen.classList.remove('dissolving');
      loadingScreen.setAttribute('aria-busy', 'true');

      startCaptionCycle();
      shuffleIntervalId = setInterval(tickShuffleAnimation, 380);

      setTimeout(() => {
        stopShuffleRitual();
        loadingScreen.classList.add('ritual-out');

        setTimeout(() => {
          loadingScreen.classList.remove('active', 'ritual-out', 'dissolving');
          loadingScreen.setAttribute('aria-busy', 'false');
          quizContainer.style.display = 'none';
          showResultScreen();

          console.log('Soul Oracle Complete — Final Scores:', { ...window.soulScores });
          console.log('Guardian Arcana Matched:', {
            id: window.guardianArcana.card.id,
            nameEn: window.guardianArcana.card.nameEn,
            nameZh: window.guardianArcana.card.nameZh,
            distance: window.guardianArcana.distance.toFixed(2),
          });
        }, 1000);
      }, SHUFFLE_DURATION_MS);
    }

    function resetResultScreen() {
      guardianFlipped = false;
      guardianFlip.classList.remove('is-flipped');
      resultFlipHint.classList.remove('hidden-hint');
      resultHeader.classList.remove('revealed');
      resultDetails.classList.remove('revealed');
      resultReenter.classList.remove('revealed');
      resultScreen.classList.remove('visible');
    }

    function showResultScreen() {
      const card = window.guardianArcana?.card;
      if (!card) return;

      resetResultScreen();
      const display = getArcanaDisplay(card);

      const imageUrl = getArcanaImageUrl(card);
      guardianFrontImg.alt = `${display.titleLine}`;
      resultCardTitle.textContent = display.titleLine;
      resultOracle.textContent = display.oracle;

      if (guardianImageCache.url === imageUrl && guardianImageCache.ready) {
        guardianFrontImg.src = imageUrl;
      } else {
        guardianFrontImg.removeAttribute('src');
        preloadGuardianImage(card).then(() => {
          guardianFrontImg.src = imageUrl;
        }).catch(() => {
          guardianFrontImg.src = imageUrl;
        });
      }

      requestAnimationFrame(() => {
        resultScreen.scrollTop = 0;
        resultScreen.classList.add('visible');
        window.appState = 'reveal';
      });
    }

    function flipGuardianCard() {
      if (guardianFlipped || window.appState !== 'reveal') return;
      guardianFlipped = true;
      guardianFlip.classList.add('is-flipped');
      resultFlipHint.classList.add('hidden-hint');

      setTimeout(() => {
        resultHeader.classList.add('revealed');
        resultDetails.classList.add('revealed');
        resultReenter.classList.add('revealed');
        window.appState = 'revealed';
      }, 580);
    }

    guardianFlip.addEventListener('click', flipGuardianCard);
    guardianFlip.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        flipGuardianCard();
      }
    });

    resultReenterBtn.addEventListener('click', () => {
      window.location.reload();
    });

    function finishQuiz() {
      quizProgressFill.style.width = '100%';
      quizProgressLabel.textContent = `${oracleQuestions.length} / ${oracleQuestions.length}`;
      quizMain.innerHTML = '';
      window.appState = 'completing';
      isAdvancing = false;

      quizContainer.classList.add('quiz-fade-out');

      setTimeout(() => {
        quizContainer.classList.remove('visible', 'quiz-fade-out');
        beginShuffleRitual();
      }, QUIZ_FADE_MS);
    }

    function startQuiz() {
      currentQuestionIndex = 0;
      isAdvancing = false;
      stopShuffleRitual();
      window.guardianArcana = null;
      guardianImageCache = { url: null, ready: false };
      resetResultScreen();
      loadingScreen.classList.remove('active', 'dissolving', 'ritual-out');
      quizContainer.classList.remove('quiz-fade-out');
      window.soulScores = {
        introversion: 50,
        logic: 50,
        stability: 50,
        idealism: 50,
      };
      quizMain.classList.remove('hidden');
      renderQuestion(0, true);
    }

    /* ── Smoke fade → quiz fade in ── */
    function beginQuizTransition() {
      if (window.appState !== 'welcome') return;
      window.appState = 'transitioning';

      const welcome = document.getElementById('welcome-layer');
      welcome.classList.add('transitioning');

      smokeOverlay.classList.add('active');
      smokeOverlay.classList.remove('dissipate');

      setTimeout(() => {
        console.log('Transition to Quiz');
        quizContainer.classList.add('visible');
        startQuiz();
        window.appState = 'quiz';
      }, 900);

      setTimeout(() => {
        smokeOverlay.classList.add('dissipate');
        smokeOverlay.classList.remove('active');
      }, 1100);

      setTimeout(() => {
        welcome.style.display = 'none';
        smokeOverlay.classList.remove('dissipate', 'active');
      }, 2000);
    }

    track.addEventListener('click', (e) => {
      if (e.target.closest('.tarot-card')) beginQuizTransition();
    });
    track.addEventListener('keydown', (e) => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.tarot-card')) {
        e.preventDefault();
        beginQuizTransition();
      }
    });
  </script>
</body>
</html>
